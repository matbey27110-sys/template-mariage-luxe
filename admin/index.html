<!doctype html>
<html lang="fr" data-theme="noir-or" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Espace mariés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:slnt,wght@-14..14,100..1000&display=swap" rel="stylesheet">
<!-- Le back-office prend le thème choisi par le couple : mêmes tokens et mêmes fichiers de thème que le site -->
<link rel="stylesheet" href="../css/tokens.css?v=20261108f">
<link rel="stylesheet" href="../themes/noir-or.css?v=20261108f">
<link rel="stylesheet" href="../themes/bordeaux.css?v=20261108f">
<link rel="stylesheet" href="../themes/emeraude.css?v=20261108f">
<link rel="stylesheet" href="../themes/nuit-bleue.css?v=20261108f">
<link rel="stylesheet" href="../themes/ivoire.css?v=20261108f">
<link rel="stylesheet" href="admin.css?v=20261108f">
<script>
  // Anti-flash : thème du couple (dernière apparence vue) + mode choisi dans l'admin, avant le premier rendu
  (function () {
    var d = document.documentElement, a = null, m = null;
    try { a = JSON.parse(localStorage.getItem('mb.apparence')); m = localStorage.getItem('mb.mode.admin'); } catch (e) {}
    if (a && /^[a-z-]+$/.test(a.theme || '')) d.setAttribute('data-theme', a.theme);
    if (m !== 'dark' && m !== 'light' && a) m = a.modeParDefaut === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : a.modeParDefaut;
    if (m === 'dark' || m === 'light') d.setAttribute('data-mode', m);
  })();
</script>
</head>
<body>

<!-- Connexion -->
<div class="login" hidden>
  <form class="login-card">
    <p class="kicker">Espace mariés</p>
    <h1>Connexion</h1>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label>
    <p class="error" role="alert"></p>
    <button class="btn btn-gold" type="submit">Se connecter</button>
  </form>
</div>

<!-- Application -->
<div class="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="brand-row">
        <span class="brand-mono"></span>
        <!-- Commutateur clair / sombre de l'INTERFACE de l'admin (n'agit pas sur le site) -->
        <div class="mode-ctl">
        <button class="mode-switch" type="button" role="switch" aria-checked="true" aria-label="Mode sombre de l'interface" aria-describedby="mode-ctl-cap">
          <svg class="sw-sun" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><path d="M6 .6v1.6M6 9.8v1.6M.6 6h1.6M9.8 6h1.6M2.2 2.2l1.1 1.1M8.7 8.7l1.1 1.1M2.2 9.8l1.1-1.1M8.7 3.3l1.1-1.1"/></svg>
          <svg class="sw-moon" viewBox="0 0 12 12" aria-hidden="true"><path d="M9.6 7.6A4.2 4.2 0 0 1 4.4 2.4a4.2 4.2 0 1 0 5.2 5.2Z"/></svg>
          <span class="sw-knob"></span>
        </button>
        <span class="ctl-cap" id="mode-ctl-cap" title="Mode clair / sombre de cet espace d'édition. Ne change pas le site des invités.">Interface</span>
        </div>
      </div>
      <span class="brand-sub">Espace mariés</span>
    </div>
    <nav class="tabs"></nav>
    <div class="side-foot">
      <a class="link" href="../" target="_blank" rel="noopener">Voir le site ↗</a>
      <button class="link logout" type="button">Se déconnecter</button>
    </div>
  </aside>

  <main class="main">
    <header class="bar">
      <div>
        <h1 class="bar-title"></h1>
        <p class="bar-hint"></p>
      </div>
      <div class="bar-actions">
        <span class="save-state"></span>
        <button class="btn btn-ghost btn-sm cancel" type="button" disabled>Annuler les modifications</button>
        <button class="btn btn-gold save" type="button" disabled>Enregistrer</button>
      </div>
    </header>

    <!-- Téléphone : on passe de l'éditeur à l'aperçu -->
    <div class="view-switch" role="tablist" aria-label="Affichage">
      <button type="button" role="tab" aria-selected="true" data-view="edit">Modifier</button>
      <button type="button" role="tab" aria-selected="false" data-view="preview">Aperçu</button>
    </div>

    <p class="demo-banner" hidden>Mode démo : les modifications sont enregistrées dans ce navigateur uniquement. Configurez Supabase dans <code>js/config.js</code> pour la mise en ligne.</p>

    <div class="workspace">
      <div class="panel"></div>

      <!-- Aperçu en direct : le vrai site, alimenté par le brouillon (rien n'est publié avant « Enregistrer ») -->
      <aside class="preview" aria-label="Aperçu du site">
        <div class="preview-bar">
          <div class="seg" role="group" aria-label="Taille d'écran">
            <button type="button" data-device="mobile" aria-pressed="true" title="Téléphone (375 px)">Mobile</button>
            <button type="button" data-device="tablet" aria-pressed="false" title="Tablette (768 px)">Tablette</button>
            <button type="button" data-device="desktop" aria-pressed="false" title="Ordinateur (1280 px)">Bureau</button>
          </div>
          <!-- Mode du SITE dans l'aperçu : pour voir le site des invités en sombre ou en clair -->
          <div class="seg-ctl">
            <div class="seg" role="group" aria-label="Mode du site dans l'aperçu" aria-describedby="prev-mode-cap">
              <button type="button" data-preview-mode="dark" aria-pressed="true">Sombre</button>
              <button type="button" data-preview-mode="light" aria-pressed="false">Clair</button>
            </div>
            <span class="ctl-cap" id="prev-mode-cap" title="Affiche le site des invités en mode sombre ou clair, sans rien enregistrer. Les photos plein écran gardent leur voile sombre dans les deux modes.">Aperçu du site</span>
          </div>
        </div>
        <div class="preview-stage">
          <!-- .preview-fit : cadre à la taille réduite ; .preview-device : vraie taille de l'appareil, réduite par transform -->
          <div class="preview-fit" data-device="mobile"><div class="preview-device"><iframe title="Aperçu du site" src="../index.html?apercu=1" loading="eager"></iframe></div></div>
        </div>
        <p class="preview-note">Aperçu des modifications non enregistrées</p>
      </aside>
    </div>
  </main>
</div>

<div class="toast" role="status"></div>
<input type="file" class="file-picker" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../themes/index.js?v=20261108f"></script>
<script src="../js/theme.js?v=20261108f"></script>
<script src="../js/config.js?v=20261108f"></script>
<script src="../js/default-content.js?v=20261108f"></script>
<script src="../js/store.js?v=20261108f"></script>
<script src="admin.js?v=20261108f"></script>
</body>
</html>
